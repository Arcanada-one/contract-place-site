name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: static-site-smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build is reproducible (node build.mjs reproduces public/ byte for byte)
        run: |
          node --version
          node build.mjs
          git diff --exit-code -- public
          test -z "$(git status --porcelain -- public)" || { git status --porcelain -- public; exit 1; }
      - name: Licensing, SEO, robots, sitemap, llms.txt and search markup
        run: python3 scripts/check_page.py public
      - name: Paper and specification pages (structure, accessibility basics, credits)
        run: python3 scripts/check_papers.py public
      - name: Internal links and assets resolve
        run: python3 scripts/check_links.py public
      - name: Search logic unit tests
        run: node scripts/test_search.js
      - name: Serve and check the published tree
        run: |
          python3 - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from urllib.error import HTTPError
          from urllib.request import urlopen

          handler = partial(SimpleHTTPRequestHandler, directory="public")
          server = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          thread = Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              base = f"http://127.0.0.1:{server.server_port}"
              for path, needle in (("/", "Knowledge Contract Arcana"), ("/en/", "contract.place"), ("/ru/", "contract.place"), ("/zh-Hans/", "contract.place"),
                                   ("/en/research/", "3.0.0-draft.1"), ("/en/research/p09/", "Pavel Valentov"), ("/en/search/", "document-search")):
                  with urlopen(base + path, timeout=5) as response:
                      assert response.status == 200, path
                      assert needle in response.read().decode("utf-8"), (path, needle)
              for path in ("/style.css", "/app.js", "/content.js", "/search.js", "/favicon.svg", "/robots.txt", "/llms.txt", "/sitemap.xml", "/404.html"):
                  with urlopen(base + path, timeout=5) as response:
                      assert response.status == 200, path
                      assert response.read(), path
              try:
                  urlopen(base + "/en/no-such-page/", timeout=5)
                  raise SystemExit("a missing page must not answer 200")
              except HTTPError as e:
                  assert e.code == 404
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=5)
          PY

  reuse-lint:
    name: reuse-lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE compliance
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet reuse==6.2.0
          "$RUNNER_TEMP/reuse/bin/reuse" lint

  security-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: Arcanada-one/datarim/.github/workflows/reusable-security-audit.yml@5a204199acd5b708ea63d99f6d642848f532bead
    with:
      stack: framework
      datarim_ref: 5a204199acd5b708ea63d99f6d642848f532bead
      runner_labels: '["ubuntu-latest"]'

  network-exposure:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@5a204199acd5b708ea63d99f6d642848f532bead
    with:
      # This static repository has no Compose, Redis, PostgreSQL or systemd bind files.
      compose_paths: ''
      datarim_ref: 5a204199acd5b708ea63d99f6d642848f532bead
      runner_labels: '["ubuntu-latest"]'
