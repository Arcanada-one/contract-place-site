# Temporary read-only input preparation. No deployment or source rewrite.
name: Reading workbench
on:
  push:
    branches: [fix/reader-localization-20261112]
    paths: [.github/workflows/reading-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve the same pinned Pandoc used by publication CI
        run: |
          mkdir -p "$RUNNER_TEMP/reading-tools"
          curl --fail --retry 3 --location --output "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          echo "caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/pandoc.deb" "$RUNNER_TEMP/pandoc"
          cp "$RUNNER_TEMP/pandoc/usr/bin/pandoc" "$RUNNER_TEMP/reading-tools/pandoc"
          "$RUNNER_TEMP/reading-tools/pandoc" --version > "$RUNNER_TEMP/reading-tools/version.txt"
          cd "$RUNNER_TEMP/reading-tools"
          sha256sum pandoc > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reading-tools
          path: ${{ runner.temp }}/reading-tools/
          retention-days: 3
          if-no-files-found: error
