# SPDX-License-Identifier: Apache-2.0
name: Reader release verification
on:
  push:
    branches: [reader/site-refresh-20261112]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Arcanada-one/knowledge-contract
          ref: 6a6f202f7f70be2ad3aea3369e45409761708596
          path: _knowledge
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact public source inputs for local review
        run: |
          mkdir -p _reader-export
          git archive HEAD -o _reader-export/site.zip
          git -C _knowledge archive HEAD -o "$GITHUB_WORKSPACE/_reader-export/knowledge.zip"
          git -C _knowledge bundle create "$GITHUB_WORKSPACE/_reader-export/knowledge.bundle" HEAD
          git rev-parse HEAD > _reader-export/site-commit.txt
          git -C _knowledge rev-parse HEAD > _reader-export/knowledge-commit.txt
          sha256sum _reader-export/* > _reader-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reader-source-snapshot
          path: _reader-export/
          retention-days: 7
          if-no-files-found: error
