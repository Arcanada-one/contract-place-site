# SPDX-License-Identifier: Apache-2.0
name: Reader release verification
on:
  push:
    branches: [reader/site-refresh-20261112]
permissions:
  contents: read
concurrency:
  group: reader-site-refresh-20261112
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Read pinned publication inputs
        id: pins
        run: |
          python3 - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key,name in [('source','publication-manifest.json'),('roadmap','roadmap-manifest.json')]:
                  out.write(key+'='+json.load(open(name))['commit']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Arcanada-one/knowledge-contract
          ref: ${{ steps.pins.outputs.source }}
          path: _knowledge
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Arcanada-one/knowledge-contract
          ref: ${{ steps.pins.outputs.roadmap }}
          path: _roadmap
          persist-credentials: false
      - name: Install the exact existing renderer
        run: |
          mkdir -p _reader-export
          curl --fail --retry 5 --retry-all-errors --location --output _reader-export/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          echo 'caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc  _reader-export/pandoc.deb' | sha256sum -c -
          sudo dpkg -i _reader-export/pandoc.deb
          test "$(pandoc --version | head -1)" = 'pandoc 3.1.3'
      - name: Apply exact prepared source changes and build
        run: |
          python3 scripts/reader-release/apply.py
          node --check src/site/app.js
          python3 -B scripts/build_publication.py --source-dir _knowledge --roadmap-source-dir _roadmap
      - name: Validate complete publication and existing interaction checks
        run: |
          python3 -B scripts/check_publication.py
          python3 -B scripts/check_hygiene.py .
          python3 -B scripts/check_page.py public
          python3 -B scripts/check_papers.py public
          python3 -B scripts/check_links.py public
          python3 -B scripts/check_roadmap.py public --source-dir _roadmap
          python3 -B scripts/test_build.py
          python3 -B scripts/test_journal.py
          python3 -B scripts/test_renditions.py
          ROADMAP_SOURCE_DIR=_roadmap python3 -B scripts/test_roadmap.py
          node scripts/test_search.js
          node scripts/test_lab.js
          node scripts/test_analytics.js
      - name: Commit only checked source and generated output to this branch
        run: |
          test "${{ github.ref }}" = refs/heads/reader/site-refresh-20261112
          remote=$(git ls-remote origin refs/heads/reader/site-refresh-20261112 | cut -f1)
          test "$remote" = "${{ github.sha }}"
          git config user.name Arcanada
          git config user.email 275027503+Arcanada@users.noreply.github.com
          git add src/site/app.js src/site/style.css scripts/build_publication.py scripts/renditions.py src/renditions/renditions.js src/content/catalog.json src/site/content-provenance.json public
          if ! git diff --cached --quiet; then
            git commit -s -m 'feat: apply readable links, compact typography, direct languages and requirement presentation'
            git push origin HEAD:refs/heads/reader/site-refresh-20261112
          fi
      - name: Retain build and exact renderer for further local verification
        if: always()
        run: |
          git archive HEAD -o _reader-export/site-after.zip
          git rev-parse HEAD > _reader-export/site-commit.txt
          sha256sum _reader-export/* > _reader-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reader-built-site
          path: _reader-export/
          retention-days: 7
          if-no-files-found: error
