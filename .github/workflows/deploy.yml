name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/check-publication.yml
  publish:
    needs: validate
    uses: Arcanada-one/shared-workflows/.github/workflows/deploy-static-site.yml@b4a1d127ef0037836dafce6071b28db005a11eb2
    with:
      domain: contract.place
      webroot: contract.place
      publish_dir: public
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  readback:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the served site with the build
        run: python3 -B scripts/readback_served.py --publish-dir public --base-url https://contract.place --run-id "${{ github.run_id }}"
