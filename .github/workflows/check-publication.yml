name: Check publication

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Read the exact publication source
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('publication-manifest.json').read_text())
          assert manifest['schema_version'] == 1
          assert manifest['repository'] == 'Arcanada-one/knowledge-contract'
          assert re.fullmatch(r'[0-9a-f]{40}', manifest['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + manifest['repository'] + '\n')
              output.write('commit=' + manifest['commit'] + '\n')
          roadmap = json.loads(Path('roadmap-manifest.json').read_text())
          assert roadmap['schema_version'] == 1
          assert roadmap['repository'] == 'Arcanada-one/knowledge-contract'
          assert re.fullmatch(r'[0-9a-f]{40}', roadmap['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('roadmap_commit=' + roadmap['commit'] + '\n')
          PY
      - name: Check out the pinned knowledge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: _knowledge-source
          persist-credentials: false
      - name: Check out the pinned roadmap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.roadmap_commit }}
          path: _roadmap-source
          persist-credentials: false
      - name: Install the tested Markdown renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc
          test "$(pandoc --version | head -1)" = "pandoc 3.1.3"
      - name: Compile all canonical texts and build the localized site
        run: python3 -B scripts/build_publication.py --source-dir _knowledge-source --roadmap-source-dir _roadmap-source
      - name: Publication, licensing, SEO, CSP and internal navigation
        run: |
          python3 -B scripts/check_publication.py
          python3 -B scripts/check_hygiene.py .
          python3 -B scripts/check_page.py public
          python3 -B scripts/check_papers.py public
          python3 -B scripts/check_links.py public
          python3 -B scripts/check_roadmap.py public --source-dir _roadmap-source
      - name: Renderer and search boundaries
        run: |
          python3 -B scripts/test_build.py
          python3 -B scripts/test_renditions.py
          ROADMAP_SOURCE_DIR=_roadmap-source python3 -B scripts/test_roadmap.py
          node scripts/test_search.js
          node scripts/test_lab.js
      - name: Verify committed inputs and output are reproducible
        run: |
          python3 - <<'PY'
          import subprocess
          paths = ['public', 'src/content/catalog.json', 'src/site/content-provenance.json']
          state = subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all', '--', *paths],
              text=True
          )
          if state:
              raise SystemExit('Rebuild and commit the generated publication files:\n' + state)
          PY
      - name: Serve and read the generated publication
        run: |
          python3 - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from urllib.error import HTTPError
          from urllib.request import urlopen

          handler = partial(SimpleHTTPRequestHandler, directory='public')
          server = ThreadingHTTPServer(('127.0.0.1', 0), handler)
          thread = Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              base = f'http://127.0.0.1:{server.server_port}'
              pages = [
                  ('/', 'contract.place'),
                  ('/en/', 'contract.place'),
                  ('/ru/', 'lang="ru"'),
                  ('/zh-Hans/', 'lang="zh-Hans"'),
                  ('/en/science/', 'semantic-objects-and-context'),
                  ('/en/science/semantic-objects-and-context/', '<math'),
                  ('/en/engineering/specifications/knowledge-contract-core/', 'Pavel Valentov'),
                  ('/en/engineering/studies/editorial-skill-pilot/', 'Pavel Valentov'),
                  ('/en/reference/glossary/', 'Work Item'),
                  ('/en/appendices/api-integration/', 'Pavel Valentov'),
                  ('/en/search/', 'document-search'),
                  ('/en/roadmap/', 'id="rm-25"'),
                  ('/ru/roadmap/', 'Дорожная карта'),
                  ('/zh-Hans/roadmap/', '路线图'),
              ]
              for path, needle in pages:
                  with urlopen(base + path, timeout=5) as response:
                      assert response.status == 200, path
                      assert needle in response.read().decode('utf-8'), (path, needle)
              for path in ('/style.css', '/app.js', '/content.js', '/search.js',
                           '/theme.js', '/favicon.svg', '/robots.txt', '/llms.txt',
                           '/sitemap.xml', '/publication.json', '/roadmap.json', '/404.html'):
                  with urlopen(base + path, timeout=5) as response:
                      assert response.status == 200, path
                      assert response.read(), path
              try:
                  urlopen(base + '/en/no-such-page/', timeout=5)
                  raise SystemExit('A missing page must not answer 200')
              except HTTPError as error:
                  assert error.code == 404
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=5)
          PY
